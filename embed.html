<div id="nr-game" class="nr-game">

  <div class="nr-hud">
    <div class="nr-topline"><div class="nr-brand"><span class="nr-glow">◈</span> NEON <b>RALLY</b></div><span id="nr-connection" class="nr-connection">● ПОДКЛЮЧЕНИЕ</span></div>
    <div class="nr-scoreboard" id="nr-scoreboard" hidden><span id="nr-them">СОПЕРНИК</span><b id="nr-score">0 : 0</b><span id="nr-me">ВЫ</span></div>
    <div class="nr-center" id="nr-center">
      <div class="nr-panel" id="nr-panel">
        <div class="nr-panel-heading" id="nr-heading">NEON RALLY</div>
        <p id="nr-subtitle">Онлайн-арена · 1 на 1 · до 9 очков, преимущество 2</p>
        <div class="nr-home" id="nr-home"><input id="nr-nick" placeholder="Ваш никнейм" maxlength="18" value="Игрок"/><div class="nr-actions"><button id="nr-create">+ СОЗДАТЬ СТОЛ</button><button id="nr-refresh" class="nr-secondary">↻ ОБНОВИТЬ</button></div><div class="nr-table-title">СТОЛЫ · СЧЁТ В РЕАЛЬНОМ ВРЕМЕНИ</div><div id="nr-tables" class="nr-tables">Подключение...</div></div>
        <div id="nr-room" hidden><div class="nr-roomcode">КОД СТОЛА <b id="nr-code">—</b></div><div id="nr-info" class="nr-info">Ожидание...</div><div id="nr-clock" class="nr-clock"></div><div class="nr-actions"><button id="nr-ready" hidden>ГОТОВ ✓</button><button id="nr-leave" class="nr-secondary">ПОКИНУТЬ СТОЛ</button></div></div>
      </div>
    </div>
    <div id="nr-toast" class="nr-toast" hidden></div>
    <div id="nr-bottom" class="nr-bottom">ДВИГАЙ МЫШЬЮ · РАКЕТКА ИМЕЕТ ОГРАНИЧЕННУЮ СКОРОСТЬ · ДЛЯ ПОДАЧИ КОСНИСЬ МЯЧА</div>
    <button id="nr-exit" class="nr-exit" hidden>ВЫЙТИ</button>
  </div>
</div>
<style>
#nr-game{position:relative;width:min(100%,520px);aspect-ratio:1/2;min-height:580px;margin:0 auto;background:#020a1b;color:#d8f5ff;font-family:Inter,system-ui,sans-serif;overflow:hidden;border:1px solid #1b80c8;border-radius:18px;isolation:isolate;touch-action:none;user-select:none;box-shadow:0 0 32px #0056bb22}
#nr-game *,#nr-game *:before{box-sizing:border-box}#nr-game [hidden]{display:none!important}
#nr-game .nr-stage,#nr-game .nr-hud{position:absolute;inset:0}#nr-game canvas{display:block;width:100%;height:100%}#nr-game .nr-hud{pointer-events:none}#nr-game button,#nr-game input,#nr-game .nr-panel{pointer-events:auto}
#nr-game .nr-topline{position:absolute;left:14px;right:14px;top:12px;display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:10px;letter-spacing:.08em;text-shadow:0 0 12px #1ba8ff}#nr-game .nr-brand{font-size:13px;font-weight:800}#nr-game .nr-brand b,#nr-game .nr-glow{color:#31d8ff}#nr-game .nr-connection{color:#8ac7e4;font-size:9px}
#nr-game .nr-center{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:54px 16px 50px;background:#021027ac;backdrop-filter:blur(5px)}#nr-game .nr-panel{background:#061a33f2;border:1px solid #2688c3;border-radius:14px;box-shadow:0 0 32px #087dff33;width:100%;max-width:400px;max-height:84%;padding:19px;overflow:auto;text-align:center}#nr-game .nr-panel-heading{font-size:23px;letter-spacing:.13em;font-weight:850}#nr-game p{color:#8db7d3;font-size:11px;line-height:1.5;margin:8px 0 15px}#nr-game input{width:100%;padding:11px 13px;border:1px solid #2b689b;background:#06122b;color:white;border-radius:9px;outline:0}#nr-game .nr-actions{display:flex;gap:8px;margin-top:10px}#nr-game button{cursor:pointer;padding:11px 8px;border-radius:8px;background:#087fc6;border:1px solid #36d2ff;color:#fff;font-weight:800;font-size:10px;flex:1;letter-spacing:.05em}#nr-game button:hover{filter:brightness(1.18)}#nr-game button:disabled{opacity:.55}#nr-game button.nr-secondary{background:#10213c;border-color:#316c9e;color:#9edcff}
#nr-game .nr-table-title{text-align:left;color:#8ad1ff;letter-spacing:.12em;font-weight:750;font-size:10px;margin:14px 0 8px}#nr-game .nr-tables{max-height:120px;overflow:auto;text-align:left;font-size:12px;color:#99bdd5}#nr-game .nr-table{display:flex;align-items:center;gap:7px;justify-content:space-between;border-bottom:1px solid #1a426b;padding:7px 0}#nr-game .nr-table span{min-width:0;overflow:hidden;text-overflow:ellipsis}#nr-game .nr-table button{max-width:99px;padding:7px}
#nr-game .nr-roomcode{letter-spacing:.1em;color:#91c7e4;font-size:11px}#nr-game .nr-roomcode b{color:#dff8ff;font-size:15px}#nr-game .nr-info{font-size:13px;line-height:1.4;margin:14px 0 5px}#nr-game .nr-clock{min-height:32px;color:#4ce6ff;font-size:25px;font-weight:900}
#nr-game .nr-scoreboard{position:absolute;top:40px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:9px;background:#05152cee;padding:7px 10px;border:1px solid #2b83bb;border-radius:10px;white-space:nowrap}#nr-game .nr-scoreboard b{font-size:25px;color:#f2fdff}#nr-game .nr-scoreboard span{font-size:9px;color:#9cdcff;max-width:105px;overflow:hidden;text-overflow:ellipsis}#nr-game .nr-bottom{position:absolute;bottom:11px;left:53px;right:53px;text-align:center;color:#78bee3;font-size:9px;text-shadow:0 1px 6px #000;line-height:1.5}#nr-game .nr-exit{position:absolute;right:9px;bottom:11px;flex:none;padding:7px 9px;background:#0b2843}#nr-game .nr-toast{position:absolute;left:50%;top:25%;transform:translateX(-50%);max-width:85%;padding:10px 13px;border:1px solid #2abaff;border-radius:9px;background:#05182be8;text-align:center;font-size:12px;pointer-events:none}
@media(max-width:430px){#nr-game{min-height:540px;border-radius:12px}#nr-game .nr-center{padding-inline:10px}#nr-game .nr-panel{padding:14px}#nr-game .nr-scoreboard span{max-width:72px}}
</style>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js';
// Replace with your Render WebSocket URL. Keep the URL you used before.
const WS_URL = 'wss://YOUR-SERVER-DOMAIN.example';
const $ = id => document.getElementById(id);
const root=$('nr-game'), stage=$('nr-stage');
const W=72,H=144,PAD=6,R=1.5;
const token=sessionStorage.getItem('nr_token') || crypto.randomUUID(); sessionStorage.setItem('nr_token',token);
let ws,side=0,roomId=null,snapshot=null,lobby=[],lastToast='',toastUntil=0,retry=null,lastSend=0;
const scene=new THREE.Scene();scene.background=new THREE.Color('#020a1b');
const camera=new THREE.OrthographicCamera(-39,39,78,-78,0.1,300);camera.position.z=180;
const renderer=new THREE.WebGLRenderer({antialias:true,alpha:false,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio||1,1.5));renderer.outputColorSpace=THREE.SRGBColorSpace;stage.appendChild(renderer.domElement);
const arena=new THREE.Group();scene.add(arena);
const mat=(c,a=1)=>new THREE.MeshBasicMaterial({color:c,transparent:a<1,opacity:a,depthWrite:a===1});
function rect(w,h,x,y,color,alpha=1,z=0){const m=new THREE.Mesh(new THREE.PlaneGeometry(w,h),mat(color,alpha));m.position.set(x,y,z);arena.add(m);return m;}
function circle(r,c,a=1,z=4){const m=new THREE.Mesh(new THREE.CircleGeometry(r,48),mat(c,a));m.position.z=z;arena.add(m);return m;}
function ring(inside,outside,c,a=1,z=4){const m=new THREE.Mesh(new THREE.RingGeometry(inside,outside,64),mat(c,a));m.position.z=z;arena.add(m);return m;}
function line(points,c,a=1){const geo=new THREE.BufferGeometry().setFromPoints(points.map(([x,y])=>new THREE.Vector3(x,y,1)));arena.add(new THREE.Line(geo,new THREE.LineBasicMaterial({color:c,transparent:a<1,opacity:a})));}
// Table surface and the surrounding movement area. Height is world Z.
rect(128,240,0,0,'#020c20',1,-4);
for(let x=-60;x<=60;x+=12)line([[x,-116],[x,116]],'#153458',.35);
for(let y=-108;y<=108;y+=12)line([[-60,y],[60,y]],'#153458',.35);
rect(W+3,H+3,0,0,'#27c4ff',1,-2);
rect(W,H,0,0,'#073568',1,-1);
rect(W,.7,0,0,'#bfefff',1,1);
rect(.4,H,0,0,'#9adfff',.7,1);
for(const x of [-W/2,W/2])rect(.8,H,x,0,'#c3f3ff',1,1);
for(const y of [-H/2,H/2])rect(W,.8,0,y,'#c3f3ff',1,1);
// The net is shown as a mesh strip from overhead, with posts.
rect(W+5,2.2,0,0,'#38caff',.55,6);
for(let x=-36;x<=36;x+=2)rect(.25,2.5,x,0,'#e1f8ff',.9,6.1);
for(const x of [-39,39]){const post=circle(1.4,'#c8f5ff',1,6.2);post.position.x=x;}
function paddle(color){
 const group=new THREE.Group();arena.add(group);
 const handle=new THREE.Mesh(new THREE.PlaneGeometry(2.2,8),mat('#cfac78'));handle.position.set(0,-8,9);group.add(handle);
 const rim=new THREE.Mesh(new THREE.CircleGeometry(PAD+.5,48),mat('#a5efff'));rim.position.z=9.1;rim.scale.y=1.13;group.add(rim);
 const rubber=new THREE.Mesh(new THREE.CircleGeometry(PAD,48),mat(color));rubber.position.z=9.2;rubber.scale.y=1.13;group.add(rubber);
 const seam=new THREE.Mesh(new THREE.PlaneGeometry(.4,9),mat('#ffffff',.3));seam.position.z=9.3;group.add(seam);
 group.visible=false;return {parts:[group],group,position:new THREE.Vector2(),initialized:false};
}
const mine=paddle('#138fff'),theirs=paddle('#e63c63');
const ballGlow=circle(3.5,'#71dfff',.2,11),ball=circle(R,'#ffffff',1,11.2);
const shadow=circle(R,'#000714',.65,1.3);
const tether=new THREE.Line(new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(),new THREE.Vector3()]),new THREE.LineBasicMaterial({color:'#70dfff',transparent:true,opacity:.35}));arena.add(tether);
const impact=ring(1,1.5,'#c9faff',1,1.5);impact.visible=false;
const balls=[ballGlow,ball,shadow];balls.forEach(m=>m.visible=false);
let ballPos=new THREE.Vector2(),ballInitialized=false,frames=[],seenEffect=null,impactAt=0,previousRound=-1;
const heightOffset=z=>z*.38;
function toast(message,ms=2200){if(!message)return;$('nr-toast').textContent=message;$('nr-toast').hidden=false;toastUntil=performance.now()+ms;}
function stateUI(s){
 snapshot=s;
 if(s.round!==previousRound){frames=[];previousRound=s.round;ballInitialized=false;}
 frames.push({s,t:performance.now()});if(frames.length>16)frames.shift();
 if(['playing','intermission','paused','finished'].includes(s.status)){
  $('nr-scoreboard').hidden=false;
  $('nr-score').textContent=`${s.score[1-side]} : ${s.score[side]}`;
  $('nr-me').textContent=s.players[side]||'ВЫ';$('nr-them').textContent=s.players[1-side]||'СОПЕРНИК';
 }else $('nr-scoreboard').hidden=true;
 $('nr-code').textContent=s.id;
 if(['playing','intermission'].includes(s.status)){$('nr-center').hidden=true;$('nr-exit').hidden=false;$('nr-bottom').hidden=false;}
 else {
  $('nr-center').hidden=false;$('nr-exit').hidden=true;$('nr-home').hidden=true;$('nr-room').hidden=false;$('nr-bottom').hidden=true;
  $('nr-heading').textContent=({waiting:'СТОЛ СОЗДАН',ready:'ПОДГОТОВКА',paused:'ПАУЗА',finished:s.winner===side?'ПОБЕДА!':'ПОРАЖЕНИЕ'})[s.status]||'NEON RALLY';
  $('nr-info').textContent=s.msg||'';$('nr-ready').hidden=s.status!=='ready'||s.ready[side];$('nr-ready').disabled=!!s.ready[side];
 }
 if(s.msg&&s.msg!==lastToast&&s.status==='playing'){lastToast=s.msg;if(s.msg!=='Розыгрыш')toast(s.msg,1400);}
}
function nick(){return $('nr-nick').value.trim().slice(0,18)||'Игрок';}
function send(m){if(ws?.readyState===WebSocket.OPEN)ws.send(JSON.stringify(m));else toast('Нет соединения с сервером');}
function tablesUI(){const parent=$('nr-tables');parent.replaceChildren();if(!lobby.length){parent.textContent='Столов пока нет. Создай первый!';return;}for(const t of lobby){const row=document.createElement('div');row.className='nr-table';const label=document.createElement('span');const score=t.score||[0,0];label.textContent=`${t.host} · ${score[0]} : ${score[1]} · ${t.status==='waiting'?'Свободен':t.status==='paused'?'Пауза':'Играют'}`;const join=document.createElement('button');join.textContent=t.status==='waiting'?'ИГРАТЬ':'ЗАНЯТ';join.disabled=t.status!=='waiting';join.onclick=()=>send({type:'join',id:t.id,name:nick(),token});row.append(label,join);parent.append(row);}}
function home(){roomId=null;snapshot=null;frames=[];ballInitialized=false;mine.initialized=false;theirs.initialized=false;lastToast='';$('nr-scoreboard').hidden=true;$('nr-center').hidden=false;$('nr-home').hidden=false;$('nr-room').hidden=true;$('nr-exit').hidden=true;$('nr-bottom').hidden=true;$('nr-heading').textContent='NEON RALLY';send({type:'list'});}
function connect(){
 if(WS_URL.includes('YOUR-SERVER-DOMAIN')){$('nr-connection').textContent='● УКАЖИ WS_URL';$('nr-tables').textContent='Укажи свой wss:// адрес Render в коде.';return;}
 ws=new WebSocket(WS_URL);$('nr-connection').textContent='● ПОДКЛЮЧЕНИЕ';
 ws.onopen=()=>{$('nr-connection').textContent='● ОНЛАЙН';send({type:'list'});if(roomId)send({type:'resume',id:roomId,token});};
 ws.onmessage=e=>{let m;try{m=JSON.parse(e.data)}catch{return}
  if(m.type==='lobby'){lobby=m.tables||[];tablesUI();}
  if(m.type==='joined'){side=m.side;roomId=m.id;lastToast='';$('nr-code').textContent=m.id;mine.initialized=false;theirs.initialized=false;ballInitialized=false;}
  if(m.type==='state'&&m.id===roomId)stateUI(m);
  if(m.type==='resume_failed'){home();toast('Матч недоступен',3000);}
  if(m.type==='kicked'){home();toast(m.message,3500);}
  if(m.type==='error')toast(m.message,3000);
 };
 ws.onclose=()=>{$('nr-connection').textContent='● НЕТ СОЕДИНЕНИЯ';if(roomId)toast('Переподключаемся...',2400);clearTimeout(retry);retry=setTimeout(connect,2000);};
 ws.onerror=()=>{};
}
$('nr-create').onclick=()=>send({type:'create',name:nick(),token});$('nr-refresh').onclick=()=>send({type:'list'});$('nr-ready').onclick=()=>send({type:'ready'});
$('nr-leave').onclick=$('nr-exit').onclick=()=>{send({type:'leave'});home();};
function pointer(e){
 if(snapshot?.status!=='playing')return;
 // Ray -> arena: correct even when Webflow container doesn't match camera exactly.
 const bound=renderer.domElement.getBoundingClientRect();
 const ndc=new THREE.Vector3(2*(e.clientX-bound.left)/bound.width-1,1-2*(e.clientY-bound.top)/bound.height,0);
 ndc.unproject(camera);
 const x=side===1?-ndc.x:ndc.x,y=side===1?-ndc.y:ndc.y;
 const time=performance.now();if(time-lastSend<25)return;lastSend=time;
 send({type:'move',x,y});
}
stage.addEventListener('pointermove',pointer);stage.addEventListener('pointerdown',e=>{pointer(e);if(snapshot?.ball.phase==='serve')send({type:'serve'});});
function resize(){const w=stage.clientWidth,h=stage.clientHeight;if(!w||!h)return;renderer.setSize(w,h,false);const a=w/h,worldH=Math.max(252,136/a),worldW=worldH*a;camera.left=-worldW/2;camera.right=worldW/2;camera.top=worldH/2;camera.bottom=-worldH/2;camera.updateProjectionMatrix();}
new ResizeObserver(resize).observe(stage);resize();
const flip=(p)=>side===1?[-p.x,-p.y]:[p.x,p.y];
function animate(t){
 requestAnimationFrame(animate);
 // Keep field fixed. Transform player positions instead of rotating the world.
 const s=snapshot,show=!!s&&['playing','intermission','paused','finished'].includes(s.status);
 for(const item of [mine,theirs])for(const m of item.parts)m.visible=show;
 balls.forEach(m=>m.visible=show);
 if(show){
  // Render a short buffered timeline rather than chasing the newest packet.
  const target=t-65;let f0=frames[0],f1=frames[frames.length-1];
  for(let j=1;j<frames.length;j++){if(frames[j].t>=target){f0=frames[j-1];f1=frames[j];break;}f0=frames[j];}
  const k=f1.t===f0.t?1:THREE.MathUtils.clamp((target-f0.t)/(f1.t-f0.t),0,1);
  const mix=(a,b,key)=>a[key]+(b[key]-a[key])*k;
  for(const [item,i] of [[mine,side],[theirs,1-side]]){
   const p0=f0.s.paddles[i],p1=f1.s.paddles[i];const [x,y]=flip({x:mix(p0,p1,'x'),y:mix(p0,p1,'y')});
   item.group.position.set(x,y,0);item.group.rotation.z=(i===side?0:Math.PI)+THREE.MathUtils.clamp((p1.x-p0.x)*.06,-.5,.5);
  }
  const b0=f0.s.ball,b1=f1.s.ball;
  const [x,y]=flip({x:mix(b0,b1,'x'),y:mix(b0,b1,'y')});
  const z=Number.isFinite(b0.z)&&Number.isFinite(b1.z)?mix(b0,b1,'z'):10,offset=heightOffset(z);
  shadow.position.set(x,y,1.3);shadow.scale.setScalar(1+z*.022);shadow.material.opacity=Math.max(.12,.65-z*.015);
  for(const m of [ball,ballGlow]){m.position.set(x,y+offset,12);m.scale.setScalar(1+z*.009);}
  const positions=tether.geometry.attributes.position;positions.setXYZ(0,x,y,2);positions.setXYZ(1,x,y+offset,10);positions.needsUpdate=true;tether.visible=true;
  if(s.effect&&s.effect.id!==seenEffect){seenEffect=s.effect.id;impactAt=t;const [ex,ey]=flip(s.effect);impact.position.set(ex,ey+(s.effect.kind==='hit'?heightOffset(s.effect.z):0),13);impact.material.color.set(s.effect.kind==='hit'?'#fff2a8':'#5ee9ff');}
  const age=(t-impactAt)/420;impact.visible=age<1&&impactAt>0;impact.scale.setScalar(1+age*7);impact.material.opacity=Math.max(0,1-age);
  $('nr-bottom').textContent=s.status==='intermission'?`${s.msg} · следующий розыгрыш через ${Math.max(0,(s.deadline-Date.now())/1000).toFixed(1)} с`:s.ball.phase==='serve'?(s.server===side?'КЛИКНИ И ПОДВЕДИ РАКЕТКУ К МЯЧУ':'ПОДАЧА СОПЕРНИКА'):'ВЕРНИ МЯЧ ПОСЛЕ ОДНОГО ОТСКОКА';
 }else{tether.visible=false;impact.visible=false;mine.initialized=false;theirs.initialized=false;ballInitialized=false;}
 animate.prev=t;
 if(s?.status==='ready')$('nr-clock').textContent=`${Math.max(0,Math.ceil((s.deadline-Date.now())/1000))} сек.`;
 else if(s?.status==='paused')$('nr-clock').textContent=`${Math.max(0,Math.ceil((s.graceUntil-Date.now())/1000))} сек.`;else $('nr-clock').textContent='';
 if(!$('nr-toast').hidden&&performance.now()>toastUntil)$('nr-toast').hidden=true;
 renderer.render(scene,camera);
}
requestAnimationFrame(animate);connect();
</script>
